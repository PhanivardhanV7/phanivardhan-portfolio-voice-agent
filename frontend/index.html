<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b18" />
    <title>Portfolio Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="voice-widget" class="voice-widget">
      <section id="assistant-panel" class="assistant-panel" aria-label="Portfolio voice assistant" hidden>
        <div class="panel-header">
          <div class="assistant-identity">
            <img src="/static/avatar.png" alt="Phani Vardhan" />
            <div>
              <strong>Vardhan</strong>
              <span><i></i> Portfolio assistant</span>
            </div>
          </div>
          <button id="close-panel" class="icon-button" type="button" aria-label="Close assistant">×</button>
        </div>

        <div id="conversation" class="conversation" aria-live="polite">
          <div class="welcome-message">Ask me about Phani’s experience, skills, projects, education, or contact details.</div>
        </div>

        <div class="panel-controls">
          <button id="mic-button" class="mic-button" type="button" aria-label="Start speaking">
            <span class="mic-icon">●</span>
            <span id="mic-label">Start speaking</span>
          </button>
          <p id="status" class="status">Click to speak</p>
        </div>

        <form id="text-form" class="text-form">
          <input id="text-input" type="text" autocomplete="off" placeholder="Type a question…" />
          <button type="submit" aria-label="Send typed question">↑</button>
        </form>
        <div class="panel-footer">
          <span id="connection-pill" class="connection-pill"><span></span> Ready</span>
          <button id="clear-button" type="button">Clear chat</button>
        </div>
      </section>

      <button id="launcher" class="launcher" type="button" aria-label="Open portfolio voice assistant" aria-expanded="false">
        <span class="launcher-ring"></span>
        <img src="/static/avatar.png" alt="Open voice assistant" />
        <span class="launcher-badge">✦</span>
      </button>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
